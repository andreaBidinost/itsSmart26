<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Andamento temperature</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <h1>Andamento temperature</h1>

    <div class="new" aria-label="Nuova registrazione temperatura">
        <input id="macchinaInput" type="text" placeholder="Nome macchina" aria-label="Nome macchina" autocomplete="off" inputmode="text">
        <input id="temperaturaInput" type="text" placeholder="Temperatura" aria-label="Temperatura" autocomplete="off" inputmode="decimal">
        <button id="aggiungiBtn" type="button" aria-label="Aggiungi nuova riga">Aggiungi</button>
    </div>

    <div class="container">
        <div class="register">
            <div class="macchina">Tornio</div>
            <div class="temperatura">45.4</div>
        </div>
        <div class="register">
            <div class="macchina">Tornio</div>
            <div class="temperatura">45.4</div>
        </div>
        <div class="register">
            <div class="macchina">Tornio</div>
            <div class="temperatura">45.4</div>
        </div>
    </div>
    <script defer src="./app.js"></script>
</body>
</html>
